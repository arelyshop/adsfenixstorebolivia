<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArelyShop.com - Fuera de Servicio</title>
    <style>
        /* Estilos generales y fondo */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        /* Contenedor principal de la tarjeta */
        .container {
            background-color: #ffffff;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 90%;
        }

        /* Icono decorativo */
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        /* Nombre de la tienda */
        .brand {
            font-size: 20px;
            font-weight: 700;
            color: #d63031;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        /* Título principal */
        h1 {
            font-size: 28px;
            margin: 0 0 15px;
            color: #2d3436;
        }

        /* Texto descriptivo */
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #636e72;
            margin: 0 0 20px;
        }

        /* Pie de página */
        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #b2bec3;
            border-top: 1px solid #dfe6e9;
            padding-top: 20px;
        }

        /* Animación suave para el icono */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🛠️</div>
        <div class="brand">ArelyShop.com</div>
        <h1>Sitio en Mantenimiento</h1>
        <p>Actualmente estamos realizando mejoras en nuestra tienda para ofrecerte una mejor experiencia de compra. Estaremos de vuelta muy pronto.</p>
        <p>Lamentamos cualquier inconveniente y agradecemos tu paciencia.</p>
        
        <div class="footer">
            &copy; 2026 ArelyShop.com. Todos los derechos reservados.
        </div>
    </div>

</body>
</html>
